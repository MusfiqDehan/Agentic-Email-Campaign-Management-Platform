name: ecmp-backend

services:
  database:
    container_name: db-ecmp
    image: postgres:17-alpine
    env_file:
      - ../.env
    volumes:
      - postgres_data_volume:/var/lib/postgresql/data
    networks:
      - ecmp_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    container_name: redis-ecmp
    image: redis:7-alpine
    env_file:
      - ../.env
    command: [ "sh", "-c", "redis-server --requirepass $$REDIS_PASSWORD" ]
    volumes:
      - redis_data_volume:/data
    networks:
      - ecmp_network
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    container_name: backend-ecmp
    image: ghcr.io/musfiqdehan/emailcampaign-backend:latest
    command: [ "daphne", "-p", "8002", "-b", "0.0.0.0", "config.asgi:application" ]
    expose:
      - "8002"
    env_file:
      - ../.env
    volumes:
      - ../:/usr/src/app
      - static_data_volume:/usr/src/app/static
      - media_data_volume:/usr/src/app/media_files
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecmp_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:8002/health/" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 240s

  nginx:
    container_name: backend-nginx-ecmp
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_data_volume:/app/static:ro
      - media_data_volume:/app/media:ro
    ports:
      - "${WEB_PORT_BACKEND:-8002}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ecmp_network

  celery:
    container_name: celery-ecmp
    image: ghcr.io/musfiqdehan/emailcampaign-backend:latest
    command: [ "celery", "-A", "config.celery", "worker", "--loglevel=info" ]
    env_file:
      - ../.env
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ecmp_network
    restart: unless-stopped

  celery-beat:
    container_name: celery-beat-ecmp
    image: ghcr.io/musfiqdehan/emailcampaign-backend:latest
    command: [ "celery", "-A", "config.celery", "beat", "--loglevel=info" ]
    env_file:
      - ../.env
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ecmp_network
    restart: unless-stopped

volumes:
  postgres_data_volume:
  redis_data_volume:
  static_data_volume:
  media_data_volume:


networks:
  ecmp_network:
    name: ecmp_network
    external: true
