server {
    listen 80;
    server_name emailcampaign-api.musfiqdehan.com;

    # Use Docker's internal DNS resolver (valid for 30s)
    resolver 127.0.0.11 valid=30s;

    client_max_body_size 20m;

    # Serve collected static files directly
    location /static/ {
        alias /app/static/;
    }

    # Serve uploaded media directly
    location /media/ {
        alias /app/media/;
    }

    location / {
        # Use a variable to avoid startup DNS resolution issues
        set $upstream_target "http://api:8002";
        proxy_pass $upstream_target;

        proxy_http_version 1.1;

        # WebSocket support (Daphne/ASGI)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
