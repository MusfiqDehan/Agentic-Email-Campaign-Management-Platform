# ==========================================================================
# Email Campaign Management Platform - Unified Production Docker Compose
# ==========================================================================
# Usage:
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down
#
# Prerequisites:
#   - Place .env file in the same directory as this file
#   - Place Cloudflare Origin Certificate at nginx/certs/origin.pem
#   - Place Cloudflare Origin Key at nginx/certs/origin.key
# ==========================================================================

services:
  # # ─── Nginx Reverse Proxy ───────────────────────────────────────────────
  # nginx:
  #   image: nginx:1.27-alpine
  #   container_name: nginx-ecmp
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/certs:/etc/nginx/certs:ro
  #     - static_data_volume:/usr/src/app/static:ro
  #     - media_data_volume:/usr/src/app/media_files:ro
  #     - ./frontend-newsletter:/usr/share/nginx/newsletter:ro
  #   depends_on:
  #     backend:
  #       condition: service_healthy
  #     frontend:
  #       condition: service_started
  #   networks:
  #     - ecmp_network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/nginx-health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

  # ─── PostgreSQL Database ───────────────────────────────────────────────
  database:
    image: postgres:17.5-alpine
    container_name: db-ecmp
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---auth-host=scram-sha-256}
    volumes:
      - postgres_data_volume:/var/lib/postgresql/data
    networks:
      - ecmp_network
      - traefik_proxy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Redis ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis-ecmp
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data_volume:/data
    networks:
      - ecmp_network
      - traefik_proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Django Backend (Daphne ASGI) ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ecmp/backend:latest
    container_name: backend-ecmp
    command: daphne -p 8001 -b 0.0.0.0 config.asgi:application
    expose:
      - "8001"
    volumes:
      - static_data_volume:/usr/src/app/static
      - media_data_volume:/usr/src/app/media_files
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecmp_network
      - traefik_proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/healthz/')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ecmp-api.rule=Host(`emailcampaign-api.musfiqdehan.com`)"
      - "traefik.http.routers.ecmp-api.entrypoints=websecure"
      - "traefik.http.services.ecmp-api.loadbalancer.server.port=8001"

  # ─── Celery Worker ─────────────────────────────────────────────────────
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ecmp/backend:latest
    container_name: celery-ecmp
    entrypoint: []
    command: celery -A config.celery worker --loglevel=info --concurrency=4
    volumes:
      - media_data_volume:/usr/src/app/media_files
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecmp_network
      - traefik_proxy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Celery Beat Scheduler ─────────────────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ecmp/backend:latest
    container_name: celery-beat-ecmp
    entrypoint: []
    command: celery -A config.celery beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecmp_network
      - traefik_proxy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Next.js Frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://emailcampaign-api.musfiqdehan.com/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://emailcampaign-api.musfiqdehan.com}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    image: ecmp/frontend:latest
    container_name: frontend-ecmp
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
    networks:
      - ecmp_network
      - traefik_proxy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ecmp-frontend.rule=Host(`emailcampaign.musfiqdehan.com`)"
      - "traefik.http.routers.ecmp-frontend.entrypoints=websecure"
      - "traefik.http.services.ecmp-frontend.loadbalancer.server.port=3001"

# ─── Volumes ───────────────────────────────────────────────────────────────
volumes:
  postgres_data_volume:
  static_data_volume:
  media_data_volume:
  redis_data_volume:

# ─── Network ──────────────────────────────────────────────────────────────
networks:
  ecmp_network:
    driver: bridge