services:
  app:
    container_name: ecmp-frontend
    image: ghcr.io/musfiqdehan/emailcampaign-frontend:latest
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://emailcampaign-api.musfiqdehan.com/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://emailcampaign-api.musfiqdehan.com}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - HOSTNAME=0.0.0.0
    restart: unless-stopped
    networks:
      - ecmp_network

networks:
  ecmp_network:
    name: ecmp_network
    external: true
