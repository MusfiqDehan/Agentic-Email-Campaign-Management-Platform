# ==========================================================================
# Nginx Configuration - Email Campaign Management Platform
# ==========================================================================
# Reverse proxy for:
#   - emailcampaign-api.musfiqdehan.com → backend (Daphne on :8001)
#   - emailcampaign.musfiqdehan.com     → frontend (Next.js on :3001)
#
# SSL: Cloudflare Origin Certificate (Full Strict mode)
# ==========================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=frontend:10m rate=50r/s;

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=30s;

    # ── Upstream Definitions ─────────────────────────────────────────────
    upstream backend {
        server backend:8001;
    }

    upstream frontend {
        server frontend:3001;
    }

    # ── Nginx Health Check (internal) ────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # ══════════════════════════════════════════════════════════════════════
    # BACKEND API — emailcampaign-api.musfiqdehan.com
    # ══════════════════════════════════════════════════════════════════════

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name emailcampaign-api.musfiqdehan.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name emailcampaign-api.musfiqdehan.com;

        # ── SSL (Cloudflare Origin Certificate) ──────────────────────────
        ssl_certificate     /etc/nginx/certs/origin.pem;
        ssl_certificate_key /etc/nginx/certs/origin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Security Headers ─────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Django Static Files ──────────────────────────────────────────
        location /static/ {
            alias /usr/src/app/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Django Media Files ───────────────────────────────────────────
        location /media/ {
            alias /usr/src/app/media_files/;
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
        }

        # ── WebSocket: /ws/ ──────────────────────────────────────────────
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # ── API & Admin Proxy ────────────────────────────────────────────
        location / {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
        }
    }

    # ══════════════════════════════════════════════════════════════════════
    # FRONTEND — emailcampaign.musfiqdehan.com
    # ══════════════════════════════════════════════════════════════════════

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name emailcampaign.musfiqdehan.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name emailcampaign.musfiqdehan.com;

        # ── SSL (Cloudflare Origin Certificate) ──────────────────────────
        ssl_certificate     /etc/nginx/certs/origin.pem;
        ssl_certificate_key /etc/nginx/certs/origin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Security Headers ─────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Next.js Proxy ────────────────────────────────────────────────
        location / {
            limit_req zone=frontend burst=100 nodelay;
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300;
        }
    }
}
