# ==========================================================================
# CI/CD Pipeline — Email Campaign Management Platform
# ==========================================================================
# Triggers on push to main branch.
# Runs tests, then deploys to VPS via SSH.
#
# Required GitHub Secrets:
#   VPS_HOST          — VPS IP or hostname (e.g., vmi2937231.contaboserver.net)
#   VPS_USER          — SSH user (e.g., root)
#   VPS_SSH_KEY       — Private SSH key for VPS access
#   VPS_DEPLOY_PATH   — Absolute path on VPS (e.g., /root/Email-Campaign-Management-Platform)
# ==========================================================================

name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # JOB 1: Backend Tests & Lint
  # ════════════════════════════════════════════════════════════════════════
  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: test_ecmp
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_ecmp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        env:
          DEBUG: "True"
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          POSTGRES_ENGINE: "django.db.backends.postgresql"
          POSTGRES_DB: "test_ecmp"
          POSTGRES_USER: "test_user"
          POSTGRES_PASSWORD: "test_password"
          POSTGRES_HOST: "localhost"
          POSTGRES_PORT: "5432"
          REDIS_HOST: "localhost"
          REDIS_PASSWORD: ""
        run: python manage.py check

      - name: Run migrations check
        env:
          DEBUG: "True"
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          POSTGRES_ENGINE: "django.db.backends.postgresql"
          POSTGRES_DB: "test_ecmp"
          POSTGRES_USER: "test_user"
          POSTGRES_PASSWORD: "test_password"
          POSTGRES_HOST: "localhost"
          POSTGRES_PORT: "5432"
          REDIS_HOST: "localhost"
          REDIS_PASSWORD: ""
        run: python manage.py migrate --check --dry-run 2>/dev/null || python manage.py migrate --noinput

      - name: Run tests
        env:
          DEBUG: "True"
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          POSTGRES_ENGINE: "django.db.backends.postgresql"
          POSTGRES_DB: "test_ecmp"
          POSTGRES_USER: "test_user"
          POSTGRES_PASSWORD: "test_password"
          POSTGRES_HOST: "localhost"
          POSTGRES_PORT: "5432"
          REDIS_HOST: "localhost"
          REDIS_PASSWORD: ""
        run: python manage.py test --verbosity=2 --parallel
        continue-on-error: true

  # ════════════════════════════════════════════════════════════════════════
  # JOB 2: Frontend Build Check
  # ════════════════════════════════════════════════════════════════════════
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint check
        run: npx next lint
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build check
        env:
          NEXT_PUBLIC_API_URL: "https://emailcampaign-api.musfiqdehan.com/api/v1"
          NEXT_PUBLIC_WS_URL: "wss://emailcampaign-api.musfiqdehan.com"
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: "placeholder"
        run: npm run build

  # ════════════════════════════════════════════════════════════════════════
  # JOB 3: Deploy to VPS
  # ════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -e

            echo "══════════════════════════════════════════════"
            echo "  Deploying Email Campaign Management Platform"
            echo "══════════════════════════════════════════════"

            # Navigate to project directory
            cd ${{ secrets.VPS_DEPLOY_PATH }}

            # Pull latest code
            echo "→ Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # Build and deploy with Docker Compose
            echo "→ Building and starting containers..."
            docker compose build --no-cache backend frontend
            docker compose up -d

            # Wait for backend to become healthy
            echo "→ Waiting for backend health check..."
            timeout 180 bash -c '
              while true; do
                STATUS=$(docker inspect --format="{{.State.Health.Status}}" backend-ecmp 2>/dev/null || echo "starting")
                echo "  Backend status: $STATUS"
                if [ "$STATUS" = "healthy" ]; then
                  break
                fi
                sleep 10
              done
            '

            # Restart nginx to pick up any config changes
            echo "→ Restarting nginx..."
            docker compose restart nginx

            # Cleanup old images
            echo "→ Cleaning up old images..."
            docker image prune -f

            # Show final status
            echo ""
            echo "══════════════════════════════════════════════"
            echo "  Deployment complete! Container status:"
            echo "══════════════════════════════════════════════"
            docker compose ps
